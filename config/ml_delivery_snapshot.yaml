version: green500-ml-config-v2
seed: 42

splits:
  mode: snapshot
  snapshot:
    final_test_fraction: 0.20
    validation_folds: 3
  historical:
    maximum_validation_folds: 3

training:
  minimum_training_rows: 20
  coverage_bins: [0.0, 0.25, 0.50, 0.75, 1.0]
  feature_selection:
    minimum_observed_companies: 20
    minimum_observed_fraction: 0.10
    minimum_continuous_distinct_values: 5
    minimum_boolean_count_per_level: 5
    # Delivery snapshot engineering setting: retain fields whose current-source
    # null reasons are at most 40% ambiguous, while persisting every fold count.
    maximum_ambiguous_missing_fraction: 0.40
    ambiguous_missing_statuses: [not_extracted, processing, unknown, unspecified_null]
    core_categories: [financial, social, environmental, fixed_context]
    optional_categories: [climate_target, financial_target]
    use_one_standard_error_rule: true
  models:
    ebm:
      fixed:
        objective: rmse
        learning_rate: 0.04
        interactions: 0
        min_samples_leaf: 10
        validation_size: 0
        outer_bags: 1
        early_stopping_rounds: 0
        random_state: 42
        n_jobs: -1
      search:
        max_bins: [32, 64]
        max_rounds: [500, 1500]
    catboost:
      fixed:
        loss_function: RMSE
        learning_rate: 0.05
        l2_leaf_reg: 10
        random_seed: 42
        allow_writing_files: false
        verbose: false
        thread_count: -1
      search:
        depth: [4, 6]
        iterations: [300, 800]

artifacts:
  output_directory: data/ml/runs
