[project]
name = "green500"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "lxml>=5,<7",
    "openpyxl>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "pymupdf>=1.28.2",
    "pypdf>=6,<7",
    "python-dotenv>=1,<2",
    "scrapy>=2.16,<2.17",
    "tldextract>=5.3,<6",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
ml = [
    "catboost==1.2.10",
    "interpret==0.7.8",
    "numpy==2.5.3",
    "pandas==3.0.5",
    "pyyaml==6.0.3",
    "scikit-learn==1.9.1",
]
environment = [
    "beautifulsoup4==4.15.0",
    "jsonschema==4.26.0",
    "pdfplumber==0.11.10",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
